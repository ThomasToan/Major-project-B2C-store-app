name: B2C Store CI

on:
  push:
  pull_request:

jobs:
  validate-and-test:
    name: Validate and Test B2C Store
    runs-on: ubuntu-latest

    env:
      CI: true
      E2E: yes
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @repo/db db:generate

      - name: Prepare test database
        run: pnpm --filter @repo/db db:push:test

      - name: Type check database package
        run: pnpm --filter @repo/db exec tsc

      - name: Type check web app
        run: pnpm --filter @repo/web check-types

      - name: Type check Playwright tests
        run: pnpm --filter @repo/playwright exec tsc --noEmit

      - name: Install Playwright browsers
        run: pnpm --filter @repo/playwright exec playwright install --with-deps chromium

      - name: Run B2C Playwright tests
        run: pnpm --filter @repo/playwright test:b2c

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright/playwright-report/
          if-no-files-found: ignore
